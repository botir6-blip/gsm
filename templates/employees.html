{% extends "base.html" %}
{% block title %}Ходимлар{% endblock %}
{% block header %}Ходимлар{% endblock %}
{% block content %}
<section class="panel">
    <div class="panel-title">Янги ходим қўшиш</div>
    <form method="post" action="{{ url_for('add_employee') }}" class="inline-form">
        <input type="text" name="full_name" placeholder="Ходим Ф.И.О." required>
        <button type="submit" class="btn primary">Қўшиш</button>
    </form>
</section>

<section class="panel">
    <div class="panel-title">Ходимлар рўйхати</div>
    <div class="table-wrap">
        <table>
            <thead><tr><th>№</th><th>Ходим Ф.И.О.</th><th>Ҳолати</th><th>Амал</th></tr></thead>
            <tbody>
            {% for row in rows %}
            <tr>
                <form method="post" action="{{ url_for('edit_employee', employee_id=row.id) }}">
                    <td>{{ loop.index }}</td>
                    <td><input type="text" name="full_name" value="{{ row.full_name }}" required></td>
                    <td class="center"><label class="check"><input type="checkbox" name="is_active" {% if row.is_active %}checked{% endif %}> Фаол</label></td>
                    <td><button class="btn small" type="submit">Сақлаш</button></td>
                </form>
            </tr>
            {% else %}
            <tr><td colspan="4" class="empty">Ҳали ходим киритилмаган</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
