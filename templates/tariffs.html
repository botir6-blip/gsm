{% extends "base.html" %}
{% block title %}Тарифлар{% endblock %}
{% block header %}Тарифлар{% endblock %}
{% block content %}
<section class="panel">
    <div class="panel-title">Янги тариф қўшиш</div>
    <form method="post" action="{{ url_for('add_tariff') }}" class="inline-form">
        <input type="text" name="name" placeholder="Тариф номи" required>
        <input type="number" name="bonus_per_item" placeholder="1 дона бонус" min="0" required>
        <button type="submit" class="btn primary">Қўшиш</button>
    </form>
</section>

<section class="panel">
    <div class="panel-title">Тарифлар рўйхати</div>
    <div class="table-wrap">
        <table>
            <thead><tr><th>№</th><th>Тариф номи</th><th>1 дона бонус</th><th>Ҳолати</th><th>Амал</th></tr></thead>
            <tbody>
            {% for row in rows %}
            <tr>
                <form method="post" action="{{ url_for('edit_tariff', tariff_id=row.id) }}">
                    <td>{{ loop.index }}</td>
                    <td><input type="text" name="name" value="{{ row.name|tariff_name }}" required></td>
                    <td><input type="number" name="bonus_per_item" value="{{ row.bonus_per_item }}" min="0" required></td>
                    <td class="center"><label class="check"><input type="checkbox" name="is_active" {% if row.is_active %}checked{% endif %}> Фаол</label></td>
                    <td><button class="btn small" type="submit">Сақлаш</button></td>
                </form>
            </tr>
            {% else %}
            <tr><td colspan="5" class="empty">Ҳали тариф киритилмаган</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
