{% extends "base.html" %}
{% block title %}Паролни ўзгартириш{% endblock %}
{% block header %}Паролни ўзгартириш{% endblock %}
{% block content %}
<section class="panel narrow">
    <form method="post" class="form-stack">
        <label>Эски пароль
            <input type="password" name="old_password" required>
        </label>
        <label>Янги пароль
            <input type="password" name="new_password" required minlength="6">
        </label>
        <label>Янги пароль такрори
            <input type="password" name="confirm_password" required minlength="6">
        </label>
        <button class="btn primary" type="submit">Сақлаш</button>
    </form>
</section>
{% endblock %}
